services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      MEILI_URL: http://meilisearch:7700
      # Uncomment behind a reverse proxy so sign-in rate limits see the real client IP.
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: '1'
    depends_on:
      - meilisearch
    volumes:
      - data:/data

  # Manual search. Rebuilt from the app database on startup if its volume is empty.
  meilisearch:
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: 'true'
    # Localhost only, so `bun run dev` can use it too.
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meili:/meili_data

volumes:
  data:
  meili:
